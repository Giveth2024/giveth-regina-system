<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Purchase</title>

    <link rel="stylesheet" href="/css/output.css" />
  </head>

  <body class="bg-gray-950 text-white">
    <div class="min-h-screen flex items-center justify-center p-8">
      <div
        class="w-full max-w-3xl bg-gray-900 border border-gray-800 rounded-2xl shadow-xl"
      >
        <!-- Header -->
        <div class="p-8 border-b border-gray-800">
          <h1 class="text-3xl font-bold">Add Purchase</h1>

          <p class="text-gray-400 mt-2">Record purchased stock</p>
        </div>

        <form
          id="purchaseForm"
          class="p-8 grid grid-cols-1 md:grid-cols-2 gap-6"
        >
          <!-- Type -->
          <div>
            <label class="block mb-2 text-sm font-medium">
              Purchase Type
            </label>

            <select
              id="type"
              required
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            >
              <option value="">Select Type</option>

              <option value="product">Product</option>

              <option value="raw_material">Raw Material</option>
            </select>
          </div>

          <!-- Product ID -->
          <div>
            <label class="block mb-2 text-sm font-medium"> Product ID </label>

            <input
              type="text"
              id="product_id"
              required
              placeholder="Product UUID"
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>

          <!-- Quantity -->
          <div>
            <label class="block mb-2 text-sm font-medium">
              Quantity Purchased
            </label>

            <input
              type="number"
              id="quantity"
              min="1"
              step="0.01"
              placeholder="12"
              required
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>

          <!-- Package Cost -->
          <div>
            <label class="block mb-2 text-sm font-medium"> Package Cost </label>

            <input
              type="number"
              id="package_cost"
              min="0"
              step="0.01"
              placeholder="10000"
              required
              class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 outline-none"
            />
          </div>

          <!-- Unit Cost -->
          <div>
            <label class="block mb-2 text-sm font-medium">
              Cost Price Per Unit
            </label>

            <input
              type="number"
              id="unit_cost"
              readonly
              class="w-full bg-gray-700 border border-gray-700 rounded-lg px-4 py-3 text-yellow-400 font-bold"
            />
          </div>

          <!-- Total Amount -->
          <div>
            <label class="block mb-2 text-sm font-medium"> Total Amount </label>

            <input
              type="number"
              id="total_amount"
              readonly
              class="w-full bg-gray-700 border border-gray-700 rounded-lg px-4 py-3 text-green-400 font-bold"
            />
          </div>

          <!-- Button -->
          <div class="md:col-span-2 flex justify-end">
            <button
              type="submit"
              class="bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-lg font-semibold transition"
            >
              Save Purchase
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const quantity = document.getElementById("quantity");
      const packageCost = document.getElementById("package_cost");

      const unitCost = document.getElementById("unit_cost");
      const totalAmount = document.getElementById("total_amount");

      // Calculate cost per unit and total amount
      function calculatePurchase() {
        const qty = Number(quantity.value) || 0;

        const package_price = Number(packageCost.value) || 0;

        if (qty > 0 && package_price > 0) {
          // Example:
          // 10000 / 12 = 833.33

          const costPerUnit = package_price / qty;

          unitCost.value = costPerUnit.toFixed(2);

          // Example:
          // 833.33 * 12 = 9999.96

          totalAmount.value = (costPerUnit * qty).toFixed(2);
        } else {
          unitCost.value = "";

          totalAmount.value = "";
        }
      }

      quantity.addEventListener("input", calculatePurchase);

      packageCost.addEventListener("input", calculatePurchase);

      const form = document.getElementById("purchaseForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const body = {
          type: document.getElementById("type").value,

          product_id: document.getElementById("product_id").value,

          quantity: Number(quantity.value),

          cost_price: Number(unitCost.value),

          total_amount: Number(totalAmount.value),
        };

        console.log(body);

        try {
          const response = await fetch("/api/admin/purchases", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(body),
          });

          const data = await response.json();

          console.log(data);

          if (response.ok) {
            alert("Purchase added successfully.");

            form.reset();

            unitCost.value = "";
            totalAmount.value = "";
          } else {
            alert(data.errors.message);
          }
        } catch (error) {
          console.error(error);

          alert("Something went wrong.");
        }
      });
    </script>
  </body>
</html>
