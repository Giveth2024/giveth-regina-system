<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Purchase</title>

    <link rel="stylesheet" href="/css/output.css" />
  </head>

  <body class="bg-gray-950 text-white">
    <div
      class="min-h-screen flex items-center justify-center p-4 sm:p-8 text-slate-100"
    >
      <div
        class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden space-y-0"
      >
        <!-- Header -->
        <div class="p-6 sm:p-8 border-b border-slate-800 bg-slate-900/50">
          <h1 class="text-2xl font-bold tracking-tight text-slate-100">
            Add Purchase
          </h1>
          <p class="text-xs text-slate-400 mt-1">
            Search for a product or raw material to record restock orders and
            stock inventory.
          </p>
        </div>

        <!-- Purchase Form -->
        <form id="purchaseForm" class="p-6 sm:p-8 space-y-6">
          <!-- Step 1: Type & Search Bar -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <!-- Purchase Type -->
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1.5"
                >Purchase Type</label
              >
              <select
                id="type"
                required
                class="w-full bg-slate-800 border border-slate-700/60 focus:border-indigo-500/80 rounded-lg px-3.5 py-2.5 text-xs font-medium text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all cursor-pointer"
              >
                <option value="">Select Type</option>
                <option value="product">Product</option>
                <option value="raw_material">Raw Material</option>
              </select>
            </div>

            <!-- Search Input -->
            <div class="relative sm:col-span-2">
              <label class="block text-xs font-semibold text-slate-400 mb-1.5"
                >Search Item</label
              >
              <div class="relative">
                <input
                  type="text"
                  id="search"
                  autocomplete="off"
                  placeholder="Search by product or material name..."
                  class="w-full bg-slate-800 border border-slate-700/60 focus:border-indigo-500/80 rounded-lg px-3.5 py-2.5 pl-10 text-xs text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
                />
                <span
                  class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                    />
                  </svg>
                </span>
              </div>

              <!-- Search Results Dropdown -->
              <div
                id="results"
                class="hidden absolute z-20 mt-1.5 w-full rounded-xl border border-slate-700/80 bg-slate-800 shadow-2xl max-h-60 overflow-y-auto divide-y divide-slate-700/50"
              ></div>
            </div>
          </div>

          <!-- Step 2: Selected Item Meta Details (Read-Only Card) -->
          <div
            class="bg-slate-800/40 border border-slate-800 rounded-xl p-4 space-y-3"
          >
            <div
              class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 pb-1.5 border-b border-slate-800"
            >
              Item Context
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <!-- Product ID -->
              <div>
                <label class="block text-xs text-slate-400 font-medium mb-1"
                  >Product ID</label
                >
                <input
                  id="product_id"
                  readonly
                  placeholder="--"
                  class="w-full bg-slate-800/60 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-slate-300 outline-none select-all"
                />
              </div>

              <!-- Selected Product -->
              <div class="sm:col-span-2">
                <label class="block text-xs text-slate-400 font-medium mb-1"
                  >Selected Name</label
                >
                <input
                  id="product_name"
                  readonly
                  placeholder="No item selected"
                  class="w-full bg-slate-800/60 border border-slate-800 rounded-lg px-3 py-2 text-xs font-semibold text-slate-100 outline-none truncate"
                />
              </div>
            </div>
          </div>

          <!-- Step 3: Purchase Metrics & Calculated Totals -->
          <div class="space-y-3">
            <div
              class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 pb-1.5 border-b border-slate-800"
            >
              Purchase Breakdown
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <!-- Quantity -->
              <div>
                <label class="block text-xs font-semibold text-indigo-300 mb-1"
                  >Quantity</label
                >
                <input
                  type="number"
                  id="quantity"
                  min="1"
                  step="0.01"
                  required
                  placeholder="0.00"
                  class="w-full bg-slate-800 border border-indigo-500/50 focus:border-indigo-500 rounded-lg px-3 py-2 text-xs font-bold text-white outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
                />
              </div>

              <!-- Package Cost -->
              <div>
                <label class="block text-xs font-semibold text-indigo-300 mb-1"
                  >Package Cost</label
                >
                <input
                  type="number"
                  id="package_cost"
                  min="0"
                  step="0.01"
                  required
                  placeholder="0.00"
                  class="w-full bg-slate-800 border border-indigo-500/50 focus:border-indigo-500 rounded-lg px-3 py-2 text-xs font-bold text-white outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
                />
              </div>

              <!-- Cost Price Per Unit -->
              <div>
                <label class="block text-xs text-slate-400 font-medium mb-1"
                  >Unit Cost</label
                >
                <input
                  id="unit_cost"
                  readonly
                  placeholder="0.00"
                  class="w-full bg-slate-800/40 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono font-semibold text-amber-400 outline-none select-all"
                />
              </div>

              <!-- Total Amount -->
              <div>
                <label class="block text-xs text-slate-400 font-medium mb-1"
                  >Total Amount</label
                >
                <input
                  id="total_amount"
                  readonly
                  placeholder="0.00"
                  class="w-full bg-slate-800/40 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono font-bold text-emerald-400 outline-none select-all"
                />
              </div>
            </div>
          </div>

          <!-- Action Button -->
          <div class="pt-4 border-t border-slate-800 flex justify-end">
            <button
              type="submit"
              class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white px-8 py-2.5 rounded-lg text-xs font-bold tracking-wide transition-all duration-150 shadow-lg shadow-indigo-600/20"
            >
              Save Purchase
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const search = document.getElementById("search");
      const results = document.getElementById("results");

      const productId = document.getElementById("product_id");
      const productName = document.getElementById("product_name");

      const quantity = document.getElementById("quantity");
      const packageCost = document.getElementById("package_cost");
      const unitCost = document.getElementById("unit_cost");
      const totalAmount = document.getElementById("total_amount");

      let timer;

      // Search products
      search.addEventListener("input", () => {
        clearTimeout(timer);

        const value = search.value.trim();

        if (value.length < 2) {
          results.innerHTML = "";
          results.classList.add("hidden");

          return;
        }

        timer = setTimeout(async () => {
          const type = document.getElementById("type").value;

          const response = await fetch(
            `/api/admin/products?type=${type}&search=${encodeURIComponent(value)}`,
          );

          const data = await response.json();

          results.innerHTML = "";

          if (!response.ok || !data.data.length) {
            results.classList.add("hidden");

            return;
          }

          data.data.forEach((item) => {
            const div = document.createElement("div");

            div.className = "px-4 py-3 hover:bg-gray-700 cursor-pointer";

            div.textContent = item.name;

            div.onclick = () => {
              productId.value = item.id;
              productName.value = item.name;
              search.value = item.name;

              results.classList.add("hidden");
            };

            results.appendChild(div);
          });

          results.classList.remove("hidden");
        }, 300);
      });

      // Calculate

      function calculate() {
        const qty = Number(quantity.value) || 0;
        const cost = Number(packageCost.value) || 0;

        if (qty > 0 && cost > 0) {
          unitCost.value = (cost / qty).toFixed(2);
          totalAmount.value = cost.toFixed(2);
        } else {
          unitCost.value = "";
          totalAmount.value = "";
        }
      }

      quantity.addEventListener("input", calculate);
      packageCost.addEventListener("input", calculate);

      document
        .getElementById("purchaseForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const body = {
            type: document.getElementById("type").value,

            product_id: productId.value,

            quantity: Number(quantity.value),

            cost_price: Number(unitCost.value),

            total_amount: Number(totalAmount.value),
          };

          const response = await fetch("/api/admin/purchases", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(body),
          });

          const data = await response.json();

          if (response.ok) {
            alert("Purchase recorded successfully.");

            purchaseForm.reset();

            productId.value = "";
            productName.value = "";
            unitCost.value = "";
            totalAmount.value = "";
            results.innerHTML = "";
            results.classList.add("hidden");
          } else {
            alert(data.errors.message);
          }
        });
    </script>
  </body>
</html>
