<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>

    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body
    class="bg-[#0a0a0f] min-h-screen flex items-center justify-center p-6 font-sans"
  >
    <div class="w-full max-w-3xl">
      <!-- Top Label -->
      <div class="flex items-center gap-3 mb-6">
        <div
          class="w-8 h-8 rounded-lg bg-violet-600 flex items-center justify-center"
        >
          <svg
            class="w-4 h-4 text-white"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4v16m8-8H4"
            />
          </svg>
        </div>
        <span class="text-sm font-semibold text-white tracking-wide"
          >New Product</span
        >
        <div class="flex-1 h-px bg-white/5"></div>
        <span class="text-xs text-white/20 font-mono">PROD-NEW</span>
      </div>

      <!-- Main Card -->
      <div
        class="relative rounded-2xl border border-white/[0.06] bg-white/[0.02] backdrop-blur-sm overflow-hidden"
      >
        <!-- Glow accent -->
        <div
          class="absolute top-0 left-1/2 -translate-x-1/2 w-64 h-px bg-gradient-to-r from-transparent via-violet-500/60 to-transparent"
        ></div>
        <div
          class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-16 bg-violet-600/10 blur-2xl rounded-full pointer-events-none"
        ></div>

        <form id="productForm" class="p-8 space-y-10">
          <!-- ── Section 1: Identity ── -->
          <div class="space-y-5">
            <div class="flex items-center gap-2">
              <span
                class="text-[10px] font-bold uppercase tracking-[0.2em] text-violet-400"
                >Identity</span
              >
              <div class="flex-1 h-px bg-white/[0.04]"></div>
              <span class="text-[10px] text-white/15">01</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <!-- Product Name -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Product Name
                </label>
                <div class="relative">
                  <input
                    type="text"
                    id="name"
                    required
                    placeholder="e.g. Sprite 500ml"
                    class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl px-4 py-3 text-sm text-white placeholder-white/20 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300"
                  />
                </div>
              </div>

              <!-- Barcode -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Barcode / UPC
                </label>
                <div class="relative">
                  <input
                    type="text"
                    id="barcode"
                    required
                    placeholder="0796554950105"
                    class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl px-4 py-3 text-sm font-mono text-white placeholder-white/20 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300"
                  />
                </div>
              </div>

              <!-- Category -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Category
                </label>
                <select
                  id="category"
                  required
                  class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl px-4 py-3 text-sm text-white/70 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300 cursor-pointer appearance-none"
                >
                  <option value="" class="bg-[#0f0f1a]">Select category</option>
                  <option class="bg-[#0f0f1a]">Water</option>
                  <option class="bg-[#0f0f1a]">Soft Drinks</option>
                  <option class="bg-[#0f0f1a]">Energy Drinks</option>
                  <option class="bg-[#0f0f1a]">Fruit Juices</option>
                  <option class="bg-[#0f0f1a]">Beer</option>
                  <option class="bg-[#0f0f1a]">Spirits</option>
                  <option class="bg-[#0f0f1a]">Snacks</option>
                  <option class="bg-[#0f0f1a]">Food</option>
                  <option class="bg-[#0f0f1a]">Vodka</option>
                  <option class="bg-[#0f0f1a]">Gin</option>
                  <option class="bg-[#0f0f1a]">Other</option>
                </select>
              </div>

              <!-- Packaging -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Packaging Unit
                </label>
                <select
                  id="unit"
                  required
                  class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl px-4 py-3 text-sm text-white/70 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300 cursor-pointer appearance-none"
                >
                  <option value="" class="bg-[#0f0f1a]">
                    Select packaging
                  </option>
                  <option class="bg-[#0f0f1a]">Plastic</option>
                  <option class="bg-[#0f0f1a]">Glass</option>
                  <option class="bg-[#0f0f1a]">Can</option>
                  <option class="bg-[#0f0f1a]">Carton</option>
                  <option class="bg-[#0f0f1a]">Liquid</option>
                </select>
              </div>
            </div>
          </div>

          <!-- ── Section 2: Pricing ── -->
          <div class="space-y-5">
            <div class="flex items-center gap-2">
              <span
                class="text-[10px] font-bold uppercase tracking-[0.2em] text-violet-400"
                >Pricing & Margins</span
              >
              <div class="flex-1 h-px bg-white/[0.04]"></div>
              <span class="text-[10px] text-white/15">02</span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <!-- Cost Price -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Cost Price
                </label>
                <div class="relative">
                  <span
                    class="absolute left-4 top-1/2 -translate-y-1/2 text-xs text-white/25 font-mono"
                    >$</span
                  >
                  <input
                    type="number"
                    id="cost_price"
                    min="0"
                    step="0.01"
                    required
                    placeholder="0.00"
                    class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl pl-8 pr-4 py-3 text-sm text-white placeholder-white/20 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300"
                  />
                </div>
              </div>

              <!-- Selling Price -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Selling Price
                </label>
                <div class="relative">
                  <span
                    class="absolute left-4 top-1/2 -translate-y-1/2 text-xs text-white/25 font-mono"
                    >$</span
                  >
                  <input
                    type="number"
                    id="selling_price"
                    min="0"
                    step="0.01"
                    required
                    placeholder="0.00"
                    class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl pl-8 pr-4 py-3 text-sm text-white placeholder-white/20 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300"
                  />
                </div>
              </div>

              <!-- Expected Profit -->
              <div>
                <label class="block text-[11px] font-medium text-white/25 mb-2">
                  Expected Profit
                </label>
                <div
                  class="relative rounded-xl border border-emerald-500/15 bg-emerald-950/20 px-4 py-3 flex items-center justify-between"
                >
                  <span class="text-xs text-white/25 font-mono">$</span>
                  <input
                    type="number"
                    id="profit"
                    readonly
                    placeholder="0.00"
                    class="flex-1 bg-transparent text-right text-sm font-mono font-bold text-emerald-400 outline-none cursor-not-allowed placeholder-emerald-900"
                  />
                  <span
                    class="ml-2 text-[9px] font-bold uppercase tracking-widest text-emerald-500/50 bg-emerald-500/10 px-1.5 py-0.5 rounded"
                  >
                    AUTO
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- ── Section 3: Inventory ── -->
          <div class="space-y-5">
            <div class="flex items-center gap-2">
              <span
                class="text-[10px] font-bold uppercase tracking-[0.2em] text-violet-400"
                >Inventory</span
              >
              <div class="flex-1 h-px bg-white/[0.04]"></div>
              <span class="text-[10px] text-white/15">03</span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <!-- Initial Stock -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Initial Stock
                </label>
                <input
                  type="number"
                  id="quantity"
                  min="0"
                  required
                  placeholder="0"
                  class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl px-4 py-3 text-sm text-white placeholder-white/20 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300 text-center"
                />
              </div>

              <!-- Units Per Package -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Units / Pkg
                </label>
                <input
                  type="number"
                  id="total_units_per_package"
                  min="1"
                  required
                  placeholder="12"
                  class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl px-4 py-3 text-sm text-white placeholder-white/20 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300 text-center"
                />
              </div>

              <!-- Reorder Alert -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Reorder Alert
                </label>
                <input
                  type="number"
                  id="reorder_level"
                  min="0"
                  required
                  placeholder="5"
                  class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-amber-500/50 rounded-xl px-4 py-3 text-sm text-white placeholder-white/20 outline-none focus:bg-amber-950/20 focus:ring-1 focus:ring-amber-500/20 transition-all duration-300 text-center"
                />
              </div>

              <!-- Expiry Date -->
              <div class="group">
                <label
                  class="block text-[11px] font-medium text-white/40 mb-2 group-focus-within:text-violet-400 transition-colors"
                >
                  Expiry Date
                </label>
                <input
                  type="date"
                  id="expiry_date"
                  class="w-full bg-white/[0.03] border border-white/[0.07] focus:border-violet-500/50 rounded-xl px-4 py-3 text-sm text-white/50 outline-none focus:bg-violet-950/20 focus:ring-1 focus:ring-violet-500/20 transition-all duration-300 cursor-pointer"
                />
              </div>
            </div>
          </div>

          <!-- ── Footer / Submit ── -->
          <div
            class="flex items-center justify-between pt-6 border-t border-white/[0.04]"
          >
            <p class="text-xs text-white/20">All fields marked are required</p>
            <button
              type="submit"
              class="group relative flex items-center gap-2.5 bg-violet-600 hover:bg-violet-500 active:scale-95 text-white text-sm font-semibold px-8 py-3 rounded-xl transition-all duration-200 shadow-lg shadow-violet-900/50 overflow-hidden"
            >
              <!-- button glow -->
              <span
                class="absolute inset-0 bg-gradient-to-r from-violet-600 to-fuchsia-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"
              ></span>
              <svg
                class="relative w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M5 13l4 4L19 7"
                />
              </svg>
              <span class="relative">Save Product</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Footer hint -->
      <p class="text-center text-[11px] text-white/15 mt-5">
        Product will be saved to your active inventory immediately.
      </p>
    </div>

    <script>
      const costPrice = document.getElementById("cost_price");
      const sellingPrice = document.getElementById("selling_price");
      const profit = document.getElementById("profit");

      function calculateProfit() {
        const cost = Number(costPrice.value) || 0;
        const selling = Number(sellingPrice.value) || 0;

        profit.value = (selling - cost).toFixed(2);
      }

      costPrice.addEventListener("input", calculateProfit);
      sellingPrice.addEventListener("input", calculateProfit);

      const form = document.getElementById("productForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const body = {
          name: document.getElementById("name").value,
          unit: document.getElementById("unit").value,
          category: document.getElementById("category").value,
          barcode: document.getElementById("barcode").value,
          quantity: Number(document.getElementById("quantity").value),
          cost_price: Number(document.getElementById("cost_price").value),
          selling_price: Number(document.getElementById("selling_price").value),
          profit: Number(document.getElementById("profit").value),
          reorder_level: Number(document.getElementById("reorder_level").value),
          expiry_date: document.getElementById("expiry_date").value || null,
          total_units_per_package: Number(
            document.getElementById("total_units_per_package").value,
          ),
        };

        try {
          const response = await fetch("/api/admin/products", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          });

          const data = await response.json();

          if (response.ok) {
            alert("Product added successfully.");
            form.reset();
            profit.value = "";
          } else {
            alert(data.message);
          }
        } catch (error) {
          console.error(error);
          alert("Something went wrong.");
        }
      });
    </script>
  </body>
</html>
