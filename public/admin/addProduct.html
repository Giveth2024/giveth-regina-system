<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>

    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body class="bg-gray-950 text-gray-100">
    <div
      class="min-h-screen flex items-center justify-center p-6 bg-slate-950 text-slate-100"
    >
      <div
        class="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 sm:p-10 my-8 space-y-6"
      >
        <!-- Header -->
        <div class="border-b border-slate-800 pb-6 mb-8">
          <h1 class="text-2xl font-bold tracking-tight text-slate-100">
            Add Product
          </h1>
          <p class="text-xs text-slate-400 mt-2">
            Create a new product record and configure its inventory parameters.
          </p>
        </div>

        <!-- Form -->
        <form id="productForm" class="space-y-8">
          <!-- SECTION 1: General Details -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6 my-6">
            <!-- Product Name -->
            <div class="my-2">
              <label
                for="name"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Product Name
              </label>
              <input
                type="text"
                id="name"
                required
                placeholder="e.g. Sprite 500ml"
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
              />
            </div>

            <!-- Barcode -->
            <div class="my-2">
              <label
                for="barcode"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Barcode / UPC
              </label>
              <input
                type="text"
                id="barcode"
                required
                placeholder="0796554950105"
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm font-mono text-slate-100 placeholder-slate-500 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
              />
            </div>

            <!-- Category -->
            <div class="my-2">
              <label
                for="category"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Category
              </label>
              <select
                id="category"
                required
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all cursor-pointer"
              >
                <option value="">Select Category</option>
                <option>Water</option>
                <option>Soft Drinks</option>
                <option>Beer</option>
                <option>Spirits</option>
                <option>Snacks</option>
                <option>Food</option>
                <option>Other</option>
              </select>
            </div>

            <!-- Unit Packaging -->
            <div class="my-2">
              <label
                for="unit"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Packaging Unit
              </label>
              <select
                id="unit"
                required
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all cursor-pointer"
              >
                <option value="">Select Packaging</option>
                <option>Plastic</option>
                <option>Glass</option>
                <option>Can</option>
                <option>Carton</option>
                <option>Bottle</option>
              </select>
            </div>
          </div>

          <!-- Financials Divider -->
          <div class="pt-6 pb-2 border-b border-slate-800 my-8">
            <span
              class="text-xs font-bold uppercase tracking-wider text-indigo-400"
            >
              Pricing & Margins
            </span>
          </div>

          <!-- SECTION 2: Financials -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-x-8 gap-y-6 my-6">
            <!-- Cost Price -->
            <div class="my-2">
              <label
                for="cost_price"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Cost Price
              </label>
              <input
                type="number"
                id="cost_price"
                min="0"
                step="0.01"
                required
                placeholder="0.00"
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
              />
            </div>

            <!-- Selling Price -->
            <div class="my-2">
              <label
                for="selling_price"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Selling Price
              </label>
              <input
                type="number"
                id="selling_price"
                min="0"
                step="0.01"
                required
                placeholder="0.00"
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
              />
            </div>

            <!-- Expected Profit -->
            <div class="my-2">
              <label
                for="profit"
                class="block text-xs font-semibold text-slate-400 mt-1 mb-3"
              >
                Expected Profit
              </label>
              <input
                type="number"
                id="profit"
                readonly
                placeholder="0.00"
                class="w-full my-1 bg-slate-800/40 border border-slate-800 rounded-lg px-4 py-3 text-sm font-mono font-bold text-emerald-400 outline-none select-all cursor-not-allowed"
              />
            </div>
          </div>

          <!-- Inventory Divider -->
          <div class="pt-6 pb-2 border-b border-slate-800 my-8">
            <span
              class="text-xs font-bold uppercase tracking-wider text-indigo-400"
            >
              Inventory Parameters
            </span>
          </div>

          <!-- SECTION 3: Inventory -->
          <div
            class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-6 my-6"
          >
            <!-- Quantity -->
            <div class="my-2">
              <label
                for="quantity"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Initial Stock
              </label>
              <input
                type="number"
                id="quantity"
                min="0"
                step="0.01"
                required
                placeholder="0"
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
              />
            </div>

            <!-- Units Per Package -->
            <div class="my-2">
              <label
                for="total_units_per_package"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Units / Pkg
              </label>
              <input
                type="number"
                id="total_units_per_package"
                min="1"
                required
                placeholder="12"
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
              />
            </div>

            <!-- Reorder Threshold -->
            <div class="my-2">
              <label
                for="reorder_level"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Reorder Alert
              </label>
              <input
                type="number"
                id="reorder_level"
                min="0"
                step="0.01"
                required
                placeholder="5"
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
              />
            </div>

            <!-- Expiry Date -->
            <div class="my-2">
              <label
                for="expiry_date"
                class="block text-xs font-semibold text-slate-300 mt-1 mb-3"
              >
                Expiry Date
              </label>
              <input
                type="date"
                id="expiry_date"
                class="w-full my-1 bg-slate-800 border border-slate-700/60 focus:border-indigo-500 rounded-lg px-4 py-3 text-sm text-slate-100 outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all cursor-pointer"
              />
            </div>
          </div>

          <!-- Submit Action -->
          <div class="pt-8 mt-10 border-t border-slate-800 flex justify-end">
            <button
              type="submit"
              class="w-full sm:w-auto my-2 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white px-10 py-3.5 rounded-lg text-sm font-bold tracking-wide transition-all shadow-lg shadow-indigo-600/20"
            >
              Save Product
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const costPrice = document.getElementById("cost_price");
      const sellingPrice = document.getElementById("selling_price");
      const profit = document.getElementById("profit");

      function calculateProfit() {
        const cost = Number(costPrice.value) || 0;
        const selling = Number(sellingPrice.value) || 0;

        profit.value = (selling - cost).toFixed(2);
      }

      costPrice.addEventListener("input", calculateProfit);
      sellingPrice.addEventListener("input", calculateProfit);

      const form = document.getElementById("productForm");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const body = {
          name: document.getElementById("name").value,
          unit: document.getElementById("unit").value,
          category: document.getElementById("category").value,
          barcode: document.getElementById("barcode").value,
          quantity: Number(document.getElementById("quantity").value),
          cost_price: Number(document.getElementById("cost_price").value),
          selling_price: Number(document.getElementById("selling_price").value),
          profit: Number(document.getElementById("profit").value),
          reorder_level: Number(document.getElementById("reorder_level").value),
          expiry_date: document.getElementById("expiry_date").value || null,
          total_units_per_package: Number(
            document.getElementById("total_units_per_package").value,
          ),
        };

        try {
          const response = await fetch("/api/admin/products", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(body),
          });

          const data = await response.json();

          if (response.ok) {
            alert("Product added successfully.");
            form.reset();
            profit.value = "";
          } else {
            alert(data.message);
          }
        } catch (error) {
          console.error(error);
          alert("Something went wrong.");
        }
      });
    </script>
  </body>
</html>
