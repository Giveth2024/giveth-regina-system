<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Search Products</title>

    <link rel="stylesheet" href="/css/output.css" />
  </head>

  <body class="bg-gray-950 text-white">
    <div class="min-h-screen max-w-5xl mx-auto p-4 sm:p-8 text-slate-100">
      <!-- Header -->
      <div class="mb-6">
        <h1 class="text-2xl font-bold tracking-tight text-slate-100">
          Search & Add Products
        </h1>
        <p class="text-xs text-slate-400 mt-1">
          Scan or search for inventory items to quickly build sale orders.
        </p>
      </div>

      <!-- Search Input Container -->
      <div class="relative mb-6">
        <input
          type="text"
          id="search"
          placeholder="Search by name, barcode, or product ID..."
          class="w-full rounded-xl bg-slate-900 border border-slate-800 px-4 py-3.5 pl-11 text-sm text-slate-100 placeholder-slate-500 outline-none transition-all focus:border-indigo-500/80 focus:ring-2 focus:ring-indigo-500/20 shadow-inner"
        />
        <!-- Search Icon Indicator -->
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </span>
      </div>

      <!-- Search Results Dropdown/List Container -->
      <div id="results" class="mb-6 empty:hidden"></div>

      <!-- Sales Form Container -->
      <form
        id="salesForm"
        class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6"
      >
        <!-- Section 1: Read-Only Meta Grid -->
        <div>
          <div
            class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 pb-2 border-b border-slate-800"
          >
            Product Details
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <!-- Product ID -->
            <div>
              <label class="block text-xs text-slate-400 font-medium mb-1"
                >Product ID</label
              >
              <input
                type="text"
                id="id"
                readonly
                placeholder="--"
                class="w-full bg-slate-800/50 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-slate-300 outline-none select-all"
              />
            </div>

            <!-- Product Name -->
            <div class="col-span-2 sm:col-span-2">
              <label class="block text-xs text-slate-400 font-medium mb-1"
                >Product Name</label
              >
              <input
                type="text"
                id="name"
                readonly
                placeholder="No product selected"
                class="w-full bg-slate-800/50 border border-slate-800 rounded-lg px-3 py-2 text-xs font-semibold text-slate-100 outline-none truncate"
              />
            </div>

            <!-- Barcode -->
            <div>
              <label class="block text-xs text-slate-400 font-medium mb-1"
                >Barcode</label
              >
              <input
                type="text"
                id="barcode"
                readonly
                placeholder="--"
                class="w-full bg-slate-800/50 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-slate-400 outline-none"
              />
            </div>

            <!-- Category -->
            <div>
              <label class="block text-xs text-slate-400 font-medium mb-1"
                >Category</label
              >
              <input
                type="text"
                id="category"
                readonly
                placeholder="--"
                class="w-full bg-slate-800/50 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 outline-none"
              />
            </div>

            <!-- Unit -->
            <div>
              <label class="block text-xs text-slate-400 font-medium mb-1"
                >Unit</label
              >
              <input
                type="text"
                id="unit"
                readonly
                placeholder="--"
                class="w-full bg-slate-800/50 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-300 outline-none"
              />
            </div>

            <!-- Cost Price -->
            <div>
              <label class="block text-xs text-slate-400 font-medium mb-1"
                >Cost Price</label
              >
              <input
                type="text"
                id="cost_price"
                readonly
                placeholder="0.00"
                class="w-full bg-slate-800/50 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono text-slate-400 outline-none"
              />
            </div>

            <!-- Selling Price -->
            <div>
              <label class="block text-xs text-slate-400 font-medium mb-1"
                >Selling Price</label
              >
              <input
                type="text"
                id="selling_price"
                readonly
                placeholder="0.00"
                class="w-full bg-slate-800/50 border border-slate-800 rounded-lg px-3 py-2 text-xs font-mono font-semibold text-emerald-400 outline-none"
              />
            </div>
          </div>
        </div>

        <!-- Section 2: Quantity & Actions Bar -->
        <div
          class="pt-4 border-t border-slate-800 grid grid-cols-1 sm:grid-cols-3 gap-4 items-end"
        >
          <!-- Available Quantity (Stock Indicator) -->
          <div>
            <label class="block text-xs text-slate-400 font-medium mb-1"
              >Stock Available</label
            >
            <input
              type="number"
              id="available_quantity"
              readonly
              placeholder="0"
              class="w-full bg-slate-800/50 border border-slate-800 rounded-lg px-3 py-2.5 text-sm font-semibold text-slate-200 outline-none"
            />
          </div>

          <!-- Quantity To Sell (Active Input) -->
          <div>
            <label class="block text-xs text-indigo-300 font-semibold mb-1"
              >Quantity To Sell</label
            >
            <input
              type="number"
              id="sale_quantity"
              min="1"
              step="0.01"
              placeholder="Enter qty..."
              class="w-full bg-slate-800 border border-indigo-500/50 focus:border-indigo-500 rounded-lg px-3 py-2 text-sm font-bold text-white outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
            />
          </div>

          <!-- Submit Button -->
          <div>
            <button
              type="button"
              id="addItem"
              class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white py-2.5 rounded-lg text-sm font-semibold transition-all duration-150 shadow-lg shadow-indigo-600/20"
            >
              Add Item to Sale
            </button>
          </div>
        </div>
      </form>

      <div
        id="salesContainer"
        class="my-6 overflow-x-auto rounded-xl border border-slate-800 bg-slate-900 shadow-lg"
      >
        <div
          class="w-full text-sm divide-y divide-slate-800 table table-fixed min-w-[700px]"
        >
          <!-- Table Header -->
          <div
            class="table-row bg-slate-800/60 text-xs font-semibold uppercase tracking-wider text-slate-400"
          >
            <div class="table-cell py-3 px-4 text-left w-5/12">
              Item Details
            </div>
            <div class="table-cell py-3 px-3 text-right w-2/12">Barcode</div>
            <div class="table-cell py-3 px-3 text-right w-2/12">Price</div>
            <div class="table-cell py-3 px-3 text-center w-1/12">Qty</div>
            <div class="table-cell py-3 px-3 text-right w-2/12">Subtotal</div>
            <div class="table-cell py-3 px-3 text-center w-1/12">Action</div>
          </div>

          <!-- Rows Container -->
          <div
            id="salesRows"
            class="table-row-group divide-y divide-slate-800"
          ></div>
        </div>
      </div>

      <div
        class="mt-8 bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-6"
      >
        <!-- Section Title -->
        <div class="pb-3 border-b border-slate-800">
          <h2 class="text-lg font-bold text-slate-100 tracking-tight">
            Checkout
          </h2>
          <p class="text-xs text-slate-400 mt-0.5">
            Select payment method and calculate total due.
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Payment Type -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1.5"
              >Payment Method</label
            >
            <select
              id="payment_type"
              class="w-full bg-slate-800 border border-slate-700/60 focus:border-indigo-500/80 rounded-lg px-3.5 py-2.5 text-sm text-slate-100 font-medium outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all cursor-pointer"
            >
              <option value="Cash">Cash</option>
              <option value="Mobile Money">Mobile Money</option>
              <option value="Credit">Credit</option>
            </select>
          </div>

          <!-- Total Amount (Calculated Highlight) -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1.5"
              >Total Amount Due</label
            >
            <input
              type="number"
              id="total_amount"
              readonly
              placeholder="0.00"
              class="w-full bg-slate-800/40 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm font-bold font-mono text-emerald-400 outline-none select-all"
            />
          </div>

          <!-- Amount Paid (Active Input) -->
          <div>
            <label class="block text-xs font-semibold text-indigo-300 mb-1.5"
              >Amount Paid</label
            >
            <input
              type="number"
              id="amount_paid"
              min="0"
              placeholder="Enter amount paid..."
              class="w-full bg-slate-800 border border-indigo-500/50 focus:border-indigo-500 rounded-lg px-3.5 py-2.5 text-sm font-bold text-white outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
            />
          </div>

          <!-- Change Amount -->
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1.5"
              >Change Due</label
            >
            <input
              type="number"
              id="change_amount"
              readonly
              placeholder="0.00"
              class="w-full bg-slate-800/40 border border-slate-800 rounded-lg px-3.5 py-2.5 text-sm font-semibold font-mono text-slate-300 outline-none select-all"
            />
          </div>
        </div>

        <!-- Complete Sale Button -->
        <button
          type="button"
          id="sendSale"
          class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white py-3 rounded-lg text-sm font-bold tracking-wide transition-all duration-150 shadow-lg shadow-indigo-600/20"
        >
          Complete Sale
        </button>
      </div>
    </div>

    <script>
      const search = document.getElementById("search");
      const results = document.getElementById("results");

      function setProduct(product) {
        document.getElementById("id").value = product.id;
        document.getElementById("name").value = product.name;
        document.getElementById("barcode").value = product.barcode;
        document.getElementById("unit").value = product.unit;
        document.getElementById("category").value = product.category;
        document.getElementById("cost_price").value = product.cost_price;
        document.getElementById("selling_price").value = product.selling_price;
        document.getElementById("available_quantity").value = product.quantity;
      }

      function clearProductForm() {
        document.getElementById("salesForm").reset();
      }

      let timer;

      search.addEventListener("input", () => {
        clearTimeout(timer);

        timer = setTimeout(searchProducts, 300);
      });

      async function searchProducts() {
        const value = search.value.trim();

        if (value === "") {
          results.innerHTML = "";

          return;
        }

        try {
          const response = await fetch(
            `/api/admin/products?search=${encodeURIComponent(value)}`,
          );

          const data = await response.json();

          renderProducts(data.data);
        } catch (error) {
          console.error(error);
        }
      }

      function renderProducts(products) {
        results.innerHTML = "";

        if (products.length === 0) {
          results.innerHTML = `
            <div class="text-gray-400">
                No products found.
            </div>
        `;

          return;
        }

        products.forEach((product) => {
          const card = document.createElement("div");

          card.className =
            "group bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-indigo-500/60 rounded-xl p-3.5 cursor-pointer transition-all duration-150 my-2 shadow-sm hover:shadow-md";

          card.innerHTML = `
        <div class="table w-full table-fixed">
            <div class="table-row">
            <!-- Item Info Column -->
            <div class="table-cell align-middle overflow-hidden max-w-0 pr-3">
                <div class="font-semibold text-sm text-slate-100 group-hover:text-indigo-300 truncate transition-colors" title="${product.name}">
                ${product.name}
                </div>
                <div class="text-xs text-slate-500 font-mono mt-0.5 truncate">
                Barcode: ${product.barcode || "N/A"}
                </div>
            </div>

            <!-- Quick Stats / Badges Column -->
            <div class="table-cell align-middle text-right whitespace-nowrap w-44">
                <div class="inline-block px-2 py-0.5 rounded bg-slate-800 border border-slate-700/50 text-[11px] font-medium text-slate-400 mr-1.5">
                ${product.category || "General"}
                </div>
                <div class="inline-block px-2 py-0.5 rounded bg-emerald-500/10 border border-emerald-500/20 text-[11px] font-semibold text-emerald-400">
                Stock: ${product.quantity ?? 0}
                </div>
            </div>
            </div>
        </div>
        `;

          card.addEventListener("click", () => {
            localStorage.setItem(
              "selectedProduct",

              JSON.stringify(product),
            );

            console.clear();

            console.log(product);
            setProduct(product);
          });

          results.appendChild(card);
        });
      }

      window.addEventListener("DOMContentLoaded", () => {
        renderSalesItems();
      });

      document.getElementById("addItem").addEventListener("click", () => {
        const item = {
          id: document.getElementById("id").value,
          name: document.getElementById("name").value,
          barcode: document.getElementById("barcode").value,
          unit: document.getElementById("unit").value,
          category: document.getElementById("category").value,
          cost_price: Number(document.getElementById("cost_price").value),
          selling_price: Number(document.getElementById("selling_price").value),
          available_quantity: Number(
            document.getElementById("available_quantity").value,
          ),
          sale_quantity: Number(document.getElementById("sale_quantity").value),
        };

        const salesItems = JSON.parse(localStorage.getItem("salesItems")) || [];

        salesItems.push(item);

        localStorage.setItem("salesItems", JSON.stringify(salesItems));

        console.log(salesItems);
        // Render item in table
        renderSalesItems();

        // calculate totals
        calculateTotals();

        clearProductForm();
      });

      // Displaying and removing sale items
      function removeSaleItem(index) {
        const salesItems = JSON.parse(localStorage.getItem("salesItems")) || [];

        salesItems.splice(index, 1);

        localStorage.setItem("salesItems", JSON.stringify(salesItems));

        // Calculate the totals again
        calculateTotals();

        renderSalesItems();
      }

      function renderSalesItems() {
        // const container = document.getElementById("salesRows");

        const rowsContainer = document.getElementById("salesRows");

        const salesItems = JSON.parse(localStorage.getItem("salesItems")) || [];

        rowsContainer.innerHTML = "";

        if (salesItems.length === 0) {
          rowsContainer.innerHTML = `
            <div class="col-span-full text-center text-gray-400 py-10">
                No items added.
                </div>
                `;

          return;
        }
        rowsContainer.innerHTML = ""; // Clear existing rows

        salesItems.forEach((item, index) => {
          const row = document.createElement("div");
          row.className =
            "table-row hover:bg-slate-800/40 transition-colors text-slate-200";

          const subtotal =
            Number(item.selling_price) * Number(item.sale_quantity);

          row.innerHTML = `
    <!-- Column 1: Long Item Name with Truncation -->
    <div class="table-cell py-3 px-4 align-middle overflow-hidden max-w-0">
      <div class="font-semibold text-slate-100 truncate" title="${item.name}">
        ${item.name}
      </div>
      <div class="text-xs text-slate-500 font-mono truncate">
        ID: ${item.id}
      </div>
    </div>

    <!-- Column 2: Barcode -->
    <div class="table-cell py-3 px-3 align-middle text-right font-mono text-xs text-slate-400">
      ${item.barcode}
    </div>

    <!-- Column 3: Price -->
    <div class="table-cell py-3 px-3 align-middle text-right font-medium">
      ${Number(item.selling_price).toLocaleString()}
    </div>

    <!-- Column 4: Quantity -->
    <div class="table-cell py-3 px-3 align-middle text-center font-medium text-slate-300">
      ${item.sale_quantity}
    </div>

    <!-- Column 5: Subtotal -->
    <div class="table-cell py-3 px-3 align-middle text-right font-bold text-emerald-400">
      ${subtotal.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      })}
    </div>

    <!-- Column 6: Action Button -->
<!-- Column 6: Action Button (Trash Icon) -->
<div class="table-cell py-3 px-3 align-middle text-center">
  <button
    onclick="removeSaleItem(${index})"
    title="Remove item"
    class="p-1.5 text-rose-400/80 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg border border-transparent hover:border-rose-500/20 transition-all duration-150 active:scale-90"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.75"
        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
      />
    </svg>
  </button>
</div>
  `;

          rowsContainer.appendChild(row);
        });
      }

      // calculate total
      function calculateTotals() {
        const salesItems = JSON.parse(localStorage.getItem("salesItems")) || [];

        let total = 0;

        salesItems.forEach((item) => {
          total += item.sale_quantity * item.selling_price;
        });

        document.getElementById("total_amount").value = total.toFixed(2);

        calculateChange();
      }

      // calculate change
      function calculateChange() {
        const total =
          Number(document.getElementById("total_amount").value) || 0;

        const paid = Number(document.getElementById("amount_paid").value) || 0;

        document.getElementById("change_amount").value = (paid - total).toFixed(
          2,
        );
      }

      document
        .getElementById("amount_paid")
        .addEventListener("input", calculateChange);

      document
        .getElementById("sendSale")
        .addEventListener("click", async () => {
          const body = {
            payment_type: document.getElementById("payment_type").value,

            total_amount: Number(document.getElementById("total_amount").value),

            amount_paid: Number(document.getElementById("amount_paid").value),

            change_amount: Number(
              document.getElementById("change_amount").value,
            ),

            items: JSON.parse(localStorage.getItem("salesItems")) || [],
          };

          console.log(body);

          try {
            const response = await fetch("/api/admin/sales", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(body),
            });

            const data = await response.json();

            console.log(data.data.invoice_number);

            if (response.ok) {
              alert("Sale completed successfully.");

              // Clear the current sale
              localStorage.removeItem("salesItems");

              // Refresh the UI
              renderSalesItems();
              calculateTotals();

              // Clear payment fields
              document.getElementById("amount_paid").value = "";
              document.getElementById("change_amount").value = "";
            } else {
              alert(data.errors.message);
            }
          } catch (error) {
            console.error(error);

            alert("Something went wrong.");
          }
        });
    </script>
  </body>
</html>
